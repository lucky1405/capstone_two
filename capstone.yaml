name: usage-metering-billing-engine
version: 1.0.0
stack:
  language: python
  runtime: "3.13"
  framework: fastapi
  database: sqlite
run: uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python -m app.db.seed
test: pytest
base_url: http://localhost:8000
endpoints:
  health: /health
  meter: /api/v1/meter/record
  generate: /generate
  usage: /usage
  checkout: /checkout/create-session
  webhook: /webhooks/stripe
  reconcile: /admin/reconcile
  alerts: /admin/alerts/evaluate
probes:
  probe_1_idempotency: "tests/test_metering.py::test_probe_1_idempotent_metering_duplicate_prevention"
  probe_2_quota_boundary: "tests/test_quotas.py::test_probe_2_exact_quota_boundary_behavior"
  probe_3_plan_flip: "tests/test_webhooks.py::test_probe_3_stripe_checkout_webhook_flips_free_to_pro"
  probe_4_forgery_and_replay: "tests/test_webhooks.py::test_probe_4_forged_webhook_signature_rejected_400"
  probe_5_pricing_rules: "tests/test_pricing.py::test_probe_5_pricing_rules_and_usage_rollup_match"
