services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./data/billing.db
      - STRIPE_SECRET_KEY=your_stripe_test_secret_key_here
      - STRIPE_PUBLISHABLE_KEY=your_stripe_test_publishable_key_here
      - STRIPE_WEBHOOK_SECRET=your_stripe_webhook_signing_secret_here
      - STRIPE_PRO_PRICE_ID=price_pro_monthly_test
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
